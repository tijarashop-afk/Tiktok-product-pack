<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>Studio Vidéo — test HyperFrames</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0A1728; font-family: Arial, sans-serif; }
    #stage { position: relative; isolation: isolate; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(circle at 24% 30%, #163E68 0%, #0A1728 60%, #08111E 100%); color: #FFF; }
    .clip { position: absolute; inset: 0; }
    .glow { position: absolute; width: 780px; height: 780px; left: 140px; top: 540px; border-radius: 50%; background: radial-gradient(circle, #2A8EAB55 0%, transparent 67%); animation: glow 6s ease-in-out both; }
    .ring { position: absolute; width: 590px; height: 590px; left: 245px; top: 590px; border: 8px solid #F3B86A; border-radius: 50%; opacity: 0; animation: ring 2s cubic-bezier(.16,1,.3,1) .4s both; }
    .ring.two { width: 435px; height: 435px; left: 323px; top: 668px; border: 6px solid #59C6E0; animation-delay: .65s; }
    .stroke { position: absolute; width: 410px; height: 24px; left: 335px; top: 881px; border-radius: 20px; background: linear-gradient(90deg,#59C6E0,#F3B86A); transform: rotate(-35deg); opacity: 0; animation: swipe 1.5s cubic-bezier(.16,1,.3,1) 1s both; }
    .eyebrow { position: absolute; left: 96px; right: 96px; top: 200px; text-align: center; letter-spacing: 11px; font-size: 28px; font-weight: 800; color: #71D8EE; animation: rise .8s ease-out .1s both; }
    h1 { position: absolute; left: 80px; right: 80px; top: 1250px; margin: 0; font-size: 118px; font-weight: 900; text-align: center; line-height: 1; letter-spacing: -5px; animation: rise .9s ease-out 1.35s both; }
    h1 span { display: block; color: #F5BE6C; }
    .sub { position: absolute; left: 130px; right: 130px; top: 1565px; text-align: center; font-size: 37px; line-height: 1.4; color: #D3E4EC; animation: rise .7s ease-out 2.1s both; }
    .line { position: absolute; left: 420px; top: 1700px; height: 7px; width: 240px; border-radius: 10px; background: #59C6E0; animation: grow .7s ease-out 2.5s both; }
    @keyframes rise { from { transform: translateY(70px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes ring { from { transform: scale(.3) rotate(-18deg); opacity: 0; } to { transform: scale(1); opacity: .95; } }
    @keyframes swipe { from { transform: rotate(-35deg) scaleX(0); opacity: 0; } to { transform: rotate(-35deg) scaleX(1); opacity: 1; } }
    @keyframes glow { from { transform: scale(.65); opacity: .25; } 50% { transform: scale(1); opacity: .95; } to { transform: scale(1.2); opacity: .5; } }
    @keyframes grow { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  </style>
</head>
<body>
  <div id="stage" data-composition-id="studio-video-hyperframes-test" data-no-timeline data-start="0" data-duration="6" data-width="1080" data-height="1920" data-fps="30">
    <div class="clip" id="background" data-start="0" data-duration="6" data-track-index="0">
      <div class="glow"></div>
      <div class="ring"></div>
      <div class="ring two"></div>
      <div class="stroke"></div>
    </div>
    <section class="clip" id="titles" data-start="0" data-duration="6" data-track-index="1">
      <div class="eyebrow">TEST TECHNIQUE</div>
      <h1>STUDIO <span>VIDÉO</span></h1>
      <div class="sub">HyperFrames 0.9.12<br>Format vertical · Sans musique</div>
      <div class="line"></div>
    </section>
  </div>
</body>
</html>
